server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets by stripping /aib prefix
    location /aib/assets/ {
        alias /usr/share/nginx/html/assets/;
    }

    # Serve /aib routes with fallback to index.html
    location /aib/ {
        try_files $uri /index.html;
    }

    # Exact match for /aib
    location = /aib {
        return 301 /aib/;
    }

    # Root fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Allow health checks at /health if desired
    location = /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
