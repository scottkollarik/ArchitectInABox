version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MongoDB=mongodb://host.docker.internal:27017/technical-architect-db
      - ASPNETCORE_URLS=http://0.0.0.0:5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network


networks:
  app-network:
    driver: bridge